name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUSKY: 0

jobs:
  checks:
    # Same commands, same order as .husky/pre-push, so a push that skipped the
    # local hook cannot reach a green PR. The real-database checks live in a11y.
    name: Pre-push chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Biome
        run: pnpm ci:check

      - name: Check module boundaries
        run: pnpm check:boundaries

      - name: Bootstrap env files
        # The hook relies on the local .env files; the api tests validate the env at import.
        run: pnpm bootstrap

      - name: Build, type-check and unit tests
        run: pnpm turbo run build type-check test --output-logs=errors-only

      - name: Duplication
        run: pnpm check:duplication

      - name: Unused code
        run: pnpm check:unused

  build-images:
    # The deploy images build from the pruned workspace, so a Dockerfile that copies a
    # deleted file or a lockfile the prune cannot honour fails here, not at deploy time.
    # Nothing is pushed.
    name: Build deploy images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=https://api.example.com
            VITE_CONTACT_EMAIL=contact@example.com
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  a11y:
    name: Accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classroom_parents
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:54329/classroom_parents
      # The preview server, not the dev server: CORS and CSRF read CORS_ORIGIN,
      # BetterAuth trusts APP_ORIGIN only.
      CORS_ORIGIN: http://localhost:4173
      APP_ORIGIN: http://localhost:4173
      # Pinned explicitly so the CI log states which account the checks run
      # against. db:seed and the checks resolve it through
      # apps/api/scripts/seed-account.ts, which holds the same default, so
      # they stay aligned whether or not this var is set.
      SEED_EMAIL: dev@example.com

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Bootstrap env files
        run: pnpm bootstrap

      - name: Apply the committed migration
        # The checks run against the schema the migration builds, so a schema change
        # without its regenerated migration fails here instead of in production.
        run: pnpm db:migrate

      - name: Check the outbox lease claim and settle against a real database
        # Skip locked, the lease expiry, the stale settle guard and the dead replay
        # live in the claim CTE and the settle WHERE, which a mocked executor never
        # evaluates. Seeds and removes its own probe rows.
        run: pnpm --filter api check:outbox-lease

      - name: Check the sealing of linked Google tokens against a real database
        # A parent links a child through the real link callback, then refreshes twice;
        # only the stored columns prove the library seals the tokens once, never in clear,
        # and keeps no id token. Google's token endpoint is stubbed, the probes are removed.
        run: pnpm --filter api check:token-sealing

      - name: Check that a linked child account never opens the parent's session
        # BetterAuth finds a sign-in's owner by provider and account id; only the real
        # OAuth endpoints over a real database prove the child provider cannot sign in.
        run: pnpm --filter api check:child-sign-in

      - name: Seed the audited account and its session
        # Writes the signed session cookie the accessibility setup loads (no password sign-in).
        run: pnpm --filter api db:seed

      - name: Check the account-wipe rollback against a real database
        # Only a real db.transaction can prove Postgres rolled the wipe back when
        # the confirmation enqueue fails. Creates and removes its own probe user.
        run: pnpm --filter api check:wipe-rollback

      - name: Check the unit-of-work rollback on a failed Result against a real database
        # A mocked unit of work only proves the service throws inside db.transaction;
        # only Postgres proves the earlier write and its outbox row are discarded.
        run: pnpm --filter api check:uow-rollback

      - name: Check that alert messages read only the alert owner's family
        # The owner filter lives in the joins of the host query; only Postgres proves an
        # alert forged onto another family's event reads nothing. Removes its probe rows.
        run: pnpm --filter api check:alert-context

      - name: Check that a calendar feed serves only its owner's deadlines
        # The secret-hash lookup, the event window and the owner filter live in SQL; only
        # Postgres proves a rotated or revoked link serves nothing and an account deletion
        # removes the feed. Removes its probe rows.
        run: pnpm --filter api check:calendar-feed

      - name: Check that the data export reads only the parent's family
        # The owner filter lives in the host query and the 24 h limit in the stored request
        # date; only Postgres proves both. Removes its probe families.
        run: pnpm --filter api check:data-export

      - name: Check the alert dispatch claim against a real database
        # Skip locked and the lease live in the claim query; only concurrent dispatchers
        # on Postgres prove each alert is sent once and the partial index is read.
        run: pnpm --filter @modules/alerts check:alert-db
      - name: Check the children module against a real database
        # Ownership in the WHERE, the sync and disconnection claims, lease fencing and the
        # lock order of concurrent sync writes live in SQL. Seeds and removes its probes.
        run: pnpm --filter @modules/children check:child-db

      - name: Check the agenda module against a real database
        # Deduplication by unique key, the coursework partial index and the withdrawal of
        # removed coursework are SQL. Seeds and removes its probes.
        run: pnpm --filter @modules/agenda check:event-db

      - name: Check the classroom sync against a real database
        # The seen-announcement verdicts and the lease check inside each write unit only
        # hold against Postgres. Seeds and removes its probes.
        run: pnpm --filter @modules/classroom-sync check:sync-db

      - name: Check the sent email retention sweep against a real database
        # The batched delete, its lease and its heartbeat are SQL. Removes its probes.
        run: pnpm --filter api check:email-retention

      - name: Check the event history retention sweep against a real database
        # The 12 month and 30 day windows, the sync window guard (purge then sync), the
        # purge events and the cascade to reminders and alerts are SQL. Removes its probe family.
        run: pnpm --filter api check:event-retention

      - name: Check the composed api end to end against a real database
        # Fake Google and model, real modules, real Postgres: a family's agenda filled by
        # the first sync, served over HTTP, the live stream, a school block, a
        # disconnection and the RGPD revocation. Removes its probe family.
        run: pnpm --filter api check:end-to-end

      - name: Check the Sunday digest against a real database
        # The parent and week unique key, the SKIP LOCKED claim and the audience query are
        # SQL: four racing instances send each parent one digest. Removes its probes.
        run: pnpm --filter api check:weekly-digest

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter app exec playwright install --with-deps chromium

      - name: Start the API
        working-directory: apps/api
        run: |
          bun src/index.ts > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/readyz > /dev/null; then
              echo "api ready"; exit 0
            fi
            sleep 1
          done
          echo "api never became ready"; cat /tmp/api.log; exit 1

      - name: Audit
        run: pnpm turbo run check:a11y --filter=app

      - name: Create the journey database
        # The audit's api still runs on classroom_parents with real providers: on a shared
        # database its outbox relay would take the journey's first sync and mark the freshly
        # linked child as needing a reconnection. serve-journey refuses a shared database.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54329/classroom_parents_journey
        run: |
          psql postgresql://postgres:postgres@localhost:54329/classroom_parents -c 'CREATE DATABASE classroom_parents_journey'
          pnpm db:migrate

      - name: Walk the parent journey in a browser
        # Fake providers, real api and Postgres: sign-in, linking, a reminder pushed at its
        # due instant, an edit and a delete that survive a resync, a school block, a
        # disconnection, then no row naming the parent once the account wipe ran. Starts its
        # own api, control server and preview on 3183, 3189 and 4183, apart from the audit's.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54329/classroom_parents_journey
        run: pnpm --filter app check:journey

      - name: API log
        if: failure()
        # A failure before the API is started leaves no log; `cat` would then
        # fail too and bury the real error under a missing-file one.
        run: cat /tmp/api.log || echo "no api log, the run failed before the API started" 

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-traces
          path: apps/app/test-results/
          retention-days: 7
