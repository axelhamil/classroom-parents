<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbf5eb" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Contrôles, devoirs, sorties et papiers à signer de vos enfants, lus dans Google Classroom en lecture seule, rangés par semaine, avec une alerte avant chaque échéance."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Échéances Classroom" />
    <meta property="og:title" content="Échéances Classroom : toutes les échéances scolaires de vos enfants" />
    <meta
      property="og:description"
      content="L'application lit Google Classroom pour vous, en lecture seule, et vous prévient avant chaque contrôle, devoir ou sortie."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Échéances" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/google-sans-flex.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="/theme-init.js"></script>
    <title>Échéances Classroom : les échéances scolaires de vos enfants</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Échéances Classroom",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web, Android, iOS",
            "inLanguage": "fr",
            "description": "Application pour parents : lit en lecture seule les annonces et devoirs Google Classroom de chaque enfant, range les échéances par semaine et envoie une alerte avant chacune.",
            "audience": { "@type": "Audience", "audienceType": "Parents d'élèves" }
          },
          {
            "@type": "FAQPage",
            "inLanguage": "fr",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Et si l'école bloque l'application ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "L'application le détecte quand vous ajoutez l'enfant et vous donne le message exact à transmettre à l'école pour l'autoriser."
                }
              },
              {
                "@type": "Question",
                "name": "Que deviennent les données de mes enfants ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Seuls le titre, le type et la date de chaque échéance sont gardés, pour vous les afficher et vous prévenir."
                }
              },
              {
                "@type": "Question",
                "name": "Comment tout supprimer ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Dans Réglages, «\u00a0Supprimer mon compte\u00a0» efface votre compte, les comptes reliés et toutes les échéances au bout de 7 jours, et révoque les accès Google."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
